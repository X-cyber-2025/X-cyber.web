<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Piyas Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f3f4f6;
  min-height:100vh;
}

.app{
  width:100%;
  max-width:1100px;
  height:100vh;
  margin:auto;
  background:#fff;
  display:flex;
  overflow:hidden;
}

/* ================= AUTH ================= */

.auth{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.auth-box{
  width:100%;
  max-width:400px;
  padding:30px;
  border-radius:20px;
  background:#fff;
  box-shadow:0 10px 40px rgba(0,0,0,.08);
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:bold;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#777;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-bottom:12px;
  outline:none;
  font-size:15px;
}

input:focus{
  border-color:#22c55e;
}

button{
  border:0;
  cursor:pointer;
}

.primary{
  width:100%;
  padding:14px;
  border-radius:10px;
  background:#16a34a;
  color:#fff;
  font-size:16px;
  font-weight:bold;
}

.secondary{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  background:#f1f5f9;
  color:#111;
}

.error{
  color:#dc2626;
  font-size:14px;
  margin-bottom:12px;
  min-height:18px;
}

/* ================= SIDEBAR ================= */

.sidebar{
  width:320px;
  height:100%;
  border-right:1px solid #eee;
  display:flex;
  flex-direction:column;
}

.sidebar-header{
  padding:18px;
  border-bottom:1px solid #eee;
}

.brand{
  font-size:22px;
  font-weight:bold;
}

.my-email{
  color:#777;
  font-size:12px;
  margin-top:5px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.logout{
  margin-top:12px;
  padding:8px 12px;
  background:#fee2e2;
  color:#dc2626;
  border-radius:8px;
}

.users{
  flex:1;
  overflow-y:auto;
}

.user{
  padding:15px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
  border-bottom:1px solid #f1f1f1;
  transition:.15s;
}

.user:hover{
  background:#f8fafc;
}

.user:active{
  background:#eef2ff;
}

.avatar{
  width:45px;
  height:45px;
  min-width:45px;
  border-radius:50%;
  background:#16a34a;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  font-size:18px;
}

.user-name{
  font-weight:bold;
  font-size:16px;
}

.user-status{
  font-size:12px;
  color:#777;
  margin-top:3px;
}

.empty{
  height:100%;
  min-height:120px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#999;
  text-align:center;
  padding:20px;
}

/* ================= CHAT ================= */

.chat{
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.chat-header{
  height:70px;
  min-height:70px;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  padding:12px 18px;
  gap:12px;
}

.chat-title{
  font-weight:bold;
  font-size:18px;
}

.chat-subtitle{
  font-size:12px;
  color:#22c55e;
  margin-top:3px;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:20px;
  background:#f8fafc;
}

.message{
  max-width:75%;
  padding:10px 14px;
  margin-bottom:10px;
  border-radius:15px;
  line-height:1.4;
  word-wrap:break-word;
  white-space:pre-wrap;
}

.sent{
  margin-left:auto;
  background:#16a34a;
  color:#fff;
  border-bottom-right-radius:4px;
}

.received{
  margin-right:auto;
  background:#fff;
  color:#111;
  border:1px solid #eee;
  border-bottom-left-radius:4px;
}

.time{
  display:block;
  font-size:10px;
  margin-top:5px;
  opacity:.7;
}

.send-area{
  padding:12px;
  border-top:1px solid #eee;
  display:flex;
  gap:8px;
  background:#fff;
}

.send-area input{
  margin:0;
  flex:1;
}

.send-btn{
  width:55px;
  min-width:55px;
  border-radius:10px;
  background:#16a34a;
  color:#fff;
  font-size:20px;
}

.send-btn:disabled,
.primary:disabled,
.secondary:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.mobile-back{
  display:none;
  background:transparent;
  font-size:26px;
  padding:5px;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

  .app{
    width:100%;
    height:100vh;
  }

  .sidebar{
    width:100%;
    border-right:0;
  }

  .chat{
    display:none;
    width:100%;
  }

  .app.chat-open .sidebar{
    display:none;
  }

  .app.chat-open .chat{
    display:flex;
  }

  .mobile-back{
    display:block;
  }

  .message{
    max-width:85%;
  }

  .chat-header{
    padding:10px 12px;
  }

  .messages{
    padding:15px;
  }
}
</style>
</head>

<body>

<div class="app" id="app">

<!-- ================= LOGIN ================= -->

<section class="auth" id="auth">

  <div class="auth-box">

    <div class="logo">
      💬 Piyas Chat
    </div>

    <div class="subtitle">
      Private & Secure Chat
    </div>

    <div id="authError" class="error"></div>

    <input
      type="email"
      id="email"
      placeholder="Email address"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      class="primary"
      id="loginBtn"
      onclick="login()"
    >
      Login
    </button>

    <button
      class="secondary"
      id="registerBtn"
      onclick="register()"
    >
      Create New Account
    </button>

  </div>

</section>


<!-- ================= SIDEBAR ================= -->

<aside class="sidebar" id="sidebar">

  <div class="sidebar-header">

    <div class="brand">
      💬 Piyas Chat
    </div>

    <div
      class="my-email"
      id="myEmail"
    ></div>

    <button
      class="logout"
      onclick="logout()"
    >
      Logout
    </button>

  </div>

  <div
    class="users"
    id="users"
  >

    <div class="empty">
      Loading users...
    </div>

  </div>

</aside>


<!-- ================= CHAT ================= -->

<main class="chat" id="chat">

  <div class="chat-header">

    <button
      class="mobile-back"
      onclick="closeChat()"
    >
      ←
    </button>

    <div
      class="avatar"
      id="chatAvatar"
    >
      ?
    </div>

    <div>

      <div
        class="chat-title"
        id="chatName"
      >
        Select a user
      </div>

      <div
        class="chat-subtitle"
        id="chatStatus"
      >
        Private Chat
      </div>

    </div>

  </div>


  <div
    class="messages"
    id="messages"
  >

    <div class="empty">
      একজন user নির্বাচন করে chat শুরু করো 💬
    </div>

  </div>


  <div class="send-area">

    <input
      type="text"
      id="messageInput"
      placeholder="Write a message..."
      onkeydown="handleEnter(event)"
      disabled
    >

    <button
      class="send-btn"
      id="sendBtn"
      onclick="sendMessage()"
      disabled
    >
      ➤
    </button>

  </div>

</main>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://uthadawkcwfpwcfijooz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_twbqcof2uApf1-VrkMnOLA_p2mArS6f";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   GLOBAL
===================================================== */

let currentUser = null;
let selectedUser = null;
let selectedConversation = null;
let realtimeChannel = null;
let openingChat = false;


/* =====================================================
   ELEMENTS
===================================================== */

const app =
document.getElementById("app");

const auth =
document.getElementById("auth");

const sidebar =
document.getElementById("sidebar");

const chat =
document.getElementById("chat");

const usersBox =
document.getElementById("users");

const messagesBox =
document.getElementById("messages");

const messageInput =
document.getElementById("messageInput");

const sendBtn =
document.getElementById("sendBtn");


/* =====================================================
   UI
===================================================== */

function showLogin(){

  auth.style.display = "flex";

  sidebar.style.display = "none";

  chat.style.display = "none";

  app.classList.remove("chat-open");

  messageInput.disabled = true;

  sendBtn.disabled = true;
}


function showApp(){

  auth.style.display = "none";

  sidebar.style.display = "flex";

  chat.style.display = "flex";
}


function enableMessageInput(){

  messageInput.disabled = false;

  sendBtn.disabled = false;
}


function disableMessageInput(){

  messageInput.disabled = true;

  sendBtn.disabled = true;
}


/* =====================================================
   ERROR
===================================================== */

function showError(text){

  document.getElementById(
    "authError"
  ).textContent = text;
}


function clearError(){

  document.getElementById(
    "authError"
  ).textContent = "";
}


/* =====================================================
   CHECK USER
===================================================== */

async function checkUser(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getUser();

  if(error){

    console.error(error);

    showLogin();

    return;
  }

  if(data.user){

    currentUser = data.user;

    await showChatApp();

  }else{

    showLogin();
  }
}


/* =====================================================
   LOGIN
===================================================== */

async function login(){

  clearError();

  const email =
  document.getElementById(
    "email"
  ).value.trim();

  const password =
  document.getElementById(
    "password"
  ).value;

  if(!email || !password){

    showError(
      "Email এবং password দাও"
    );

    return;
  }

  const btn =
  document.getElementById(
    "loginBtn"
  );

  btn.disabled = true;

  btn.textContent =
  "Logging in...";

  const {
    data,
    error
  } =
  await supabaseClient.auth
  .signInWithPassword({

    email: email,

    password: password

  });

  btn.disabled = false;

  btn.textContent =
  "Login";

  if(error){

    showError(
      error.message
    );

    return;
  }

  currentUser =
  data.user;

  await showChatApp();
}


/* =====================================================
   REGISTER
===================================================== */

async function register(){

  clearError();

  const email =
  document.getElementById(
    "email"
  ).value.trim();

  const password =
  document.getElementById(
    "password"
  ).value;

  if(!email || !password){

    showError(
      "Email এবং password দাও"
    );

    return;
  }

  if(password.length < 6){

    showError(
      "Password কমপক্ষে ৬ অক্ষরের হতে হবে"
    );

    return;
  }

  const btn =
  document.getElementById(
    "registerBtn"
  );

  btn.disabled = true;

  btn.textContent =
  "Creating...";

  const {
    data,
    error
  } =
  await supabaseClient.auth
  .signUp({

    email: email,

    password: password

  });

  btn.disabled = false;

  btn.textContent =
  "Create New Account";

  if(error){

    showError(
      error.message
    );

    return;
  }

  if(data.user){

    currentUser =
    data.user;

    if(data.session){

      await showChatApp();

    }else{

      showError(
        "Account তৈরি হয়েছে। Email verification করে Login করো।"
      );
    }
  }
}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

  if(realtimeChannel){

    await supabaseClient
    .removeChannel(
      realtimeChannel
    );

    realtimeChannel = null;
  }

  await supabaseClient
  .auth
  .signOut();

  currentUser = null;

  selectedUser = null;

  selectedConversation = null;

  showLogin();
}


/* =====================================================
   SHOW CHAT APP
===================================================== */

async function showChatApp(){

  if(!currentUser) return;

  showApp();

  document.getElementById(
    "myEmail"
  ).textContent =
    currentUser.email || "";

  await ensureOwnProfile();

  await loadUsers();
}


/* =====================================================
   PROFILE
===================================================== */

async function ensureOwnProfile(){

  const {
    data,
    error
  } =
  await supabaseClient
  .from("profiles")
  .select("id")
  .eq(
    "id",
    currentUser.id
  )
  .maybeSingle();

  if(error){

    console.error(
      "Profile:",
      error
    );

    return;
  }

  if(data) return;

  let base =
  (
    currentUser.email ||
    "user"
  )
  .split("@")[0]
  .replace(
    /[^a-zA-Z0-9_]/g,
    ""
  )
  .toLowerCase();

  if(!base){

    base = "user";
  }

  const username =
  base +
  "_" +
  currentUser.id.slice(0,6);

  const {
    error:insertError
  } =
  await supabaseClient
  .from("profiles")
  .insert({

    id:
      currentUser.id,

    username:
      username,

    display_name:
      base,

    avatar_url:
      null

  });

  if(
    insertError &&
    insertError.code !== "23505"
  ){

    console.error(
      "Profile create:",
      insertError
    );
  }
}


/* =====================================================
   LOAD USERS
===================================================== */

async function loadUsers(){

  usersBox.innerHTML =
  `
  <div class="empty">
    Loading users...
  </div>
  `;

  const {
    data,
    error
  } =
  await supabaseClient
  .from("profiles")
  .select(
    "id,username,display_name,avatar_url"
  )
  .neq(
    "id",
    currentUser.id
  )
  .order(
    "username",
    {
      ascending:true
    }
  );

  if(error){

    console.error(
      "Users error:",
      error
    );

    usersBox.innerHTML =
    `
    <div class="empty">
      Users load করা যায়নি।<br><br>
      ${escapeHtml(error.message)}
    </div>
    `;

    return;
  }

  if(!data || data.length === 0){

    usersBox.innerHTML =
    `
    <div class="empty">
      এখনো কোনো অন্য user নেই
    </div>
    `;

    return;
  }

  usersBox.innerHTML = "";

  data.forEach(user => {

    const name =
    user.display_name ||
    user.username ||
    "User";

    const first =
    name
    .charAt(0)
    .toUpperCase();

    const div =
    document.createElement("div");

    div.className =
    "user";

    div.innerHTML =
    `
    <div class="avatar">
      ${escapeHtml(first)}
    </div>

    <div>

      <div class="user-name">
        ${escapeHtml(name)}
      </div>

      <div class="user-status">
        @${escapeHtml(
          user.username || "user"
        )}
      </div>

    </div>
    `;

    div.addEventListener(
      "click",
      function(){

        openChat(user);

      }
    );

    usersBox.appendChild(div);

  });
}


/* =====================================================
   OPEN CHAT
===================================================== */

async function openChat(user){

  if(openingChat) return;

  openingChat = true;

  selectedUser = user;

  /* MOBILE CHAT OPEN */

  app.classList.add(
    "chat-open"
  );

  chat.style.display =
    "flex";

  const name =
  user.display_name ||
  user.username ||
  "User";

  document.getElementById(
    "chatName"
  ).textContent =
    name;

  document.getElementById(
    "chatAvatar"
  ).textContent =
    name
    .charAt(0)
    .toUpperCase();

  document.getElementById(
    "chatStatus"
  ).textContent =
    "Private Chat";

  messagesBox.innerHTML =
  `
  <div class="empty">
    Conversation loading...
  </div>
  `;

  disableMessageInput();

  try{

    await findConversation();

  }catch(error){

    console.error(error);

    showMessageArea(
      "Chat খুলতে সমস্যা হয়েছে: " +
      error.message
    );

  }finally{

    openingChat = false;

  }
}


/* =====================================================
   FIND / CREATE CONVERSATION
===================================================== */

async function findConversation(){

  if(
    !currentUser ||
    !selectedUser
  ){

    return;
  }

  selectedConversation = null;

  const uid1 =
  currentUser.id;

  const uid2 =
  selectedUser.id;

  /*
    তোমার Supabase table অনুযায়ী:
    user_one
    user_two
  */

  const {
    data,
    error
  } =
  await supabaseClient
  .from("conversations")
  .select(
    "id,user_one,user_two,created_at"
  )
  .or(
    `and(user_one.eq.${uid1},user_two.eq.${uid2}),and(user_one.eq.${uid2},user_two.eq.${uid1})`
  )
  .limit(1);

  if(error){

    console.error(
      "Conversation search:",
      error
    );

    showMessageArea(
      "Conversation load হয়নি:\n" +
      error.message
    );

    return;
  }

  if(data && data.length > 0){

    selectedConversation =
    data[0];

  }else{

    const {
      data:newConversation,
      error:createError
    } =
    await supabaseClient
    .from("conversations")
    .insert({

      user_one:
        uid1,

      user_two:
        uid2

    })
    .select(
      "id,user_one,user_two,created_at"
    )
    .single();

    if(createError){

      /*
        অন্য user একই সময়ে conversation
        বানিয়ে ফেললে আবার search করবে।
      */

      if(
        createError.code === "23505"
      ){

        const retry =
        await supabaseClient
        .from("conversations")
        .select(
          "id,user_one,user_two,created_at"
        )
        .or(
          `and(user_one.eq.${uid1},user_two.eq.${uid2}),and(user_one.eq.${uid2},user_two.eq.${uid1})`
        )
        .limit(1);

        if(
          retry.data &&
          retry.data.length > 0
        ){

          selectedConversation =
          retry.data[0];

        }else{

          showMessageArea(
            "Conversation পাওয়া যায়নি।"
          );

          return;
        }

      }else{

        console.error(
          "Conversation create:",
          createError
        );

        showMessageArea(
          "Conversation তৈরি করা যায়নি:\n" +
          createError.message
        );

        return;
      }

    }else{

      selectedConversation =
      newConversation;
    }
  }

  if(!selectedConversation){

    showMessageArea(
      "Conversation পাওয়া যায়নি।"
    );

    return;
  }

  enableMessageInput();

  await loadMessages();

  subscribeRealtime();
}


/* =====================================================
   LOAD MESSAGES
===================================================== */

async function loadMessages(){

  if(!selectedConversation){

    showMessageArea(
      "Conversation পাওয়া যায়নি।"
    );

    return;
  }

  messagesBox.innerHTML =
  `
  <div class="empty">
    Loading messages...
  </div>
  `;

  const {
    data,
    error
  } =
  await supabaseClient
  .from("messages")
  .select(
    "id,conversation_id,sender_id,content,created_at"
  )
  .eq(
    "conversation_id",
    selectedConversation.id
  )
  .order(
    "created_at",
    {
      ascending:true
    }
  );

  if(error){

    console.error(
      "Messages error:",
      error
    );

    showMessageArea(
      "Messages load করা যায়নি:\n" +
      error.message
    );

    return;
  }

  messagesBox.innerHTML = "";

  if(!data || data.length === 0){

    messagesBox.innerHTML =
    `
    <div class="empty">
      কোনো message নেই।<br>
      প্রথম message পাঠাও 💬
    </div>
    `;

    return;
  }

  data.forEach(
    message => {
      renderMessage(message);
    }
  );

  scrollMessages();
}


/* =====================================================
   RENDER MESSAGE
===================================================== */

function renderMessage(message){

  if(!message) return;

  if(
    message.id &&
    document.querySelector(
      `[data-message-id="${message.id}"]`
    )
  ){

    return;
  }

  const empty =
  messagesBox.querySelector(
    ".empty"
  );

  if(empty){

    messagesBox.innerHTML = "";
  }

  const div =
  document.createElement("div");

  div.className =
  "message " +
  (
    message.sender_id ===
    currentUser.id
      ? "sent"
      : "received"
  );

  if(message.id){

    div.dataset.messageId =
    message.id;
  }

  const time =
  new Date(
    message.created_at
  )
  .toLocaleTimeString(
    "bn-BD",
    {
      hour:"numeric",
      minute:"2-digit"
    }
  );

  div.innerHTML =
  `
  ${escapeHtml(
    message.content
  )}

  <span class="time">
    ${time}
  </span>
  `;

  messagesBox.appendChild(div);

  scrollMessages();
}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  const content =
  messageInput.value.trim();

  if(!content) return;

  if(
    !currentUser ||
    !selectedConversation
  ){

    alert(
      "আগে একজন user select করো"
    );

    return;
  }

  const oldText =
  content;

  messageInput.value = "";

  sendBtn.disabled = true;

  const {
    data,
    error
  } =
  await supabaseClient
  .from("messages")
  .insert({

    conversation_id:
      selectedConversation.id,

    sender_id:
      currentUser.id,

    content:
      oldText

  })
  .select(
    "id,conversation_id,sender_id,content,created_at"
  )
  .single();

  sendBtn.disabled = false;

  messageInput.focus();

  if(error){

    console.error(
      "Send error:",
      error
    );

    alert(
      "Message পাঠানো যায়নি:\n" +
      error.message
    );

    messageInput.value =
      oldText;

    return;
  }

  /*
    নিজের message এখানে দেখানো হবে।
    Realtime থেকে আবার এলে duplicate হবে না।
  */

  renderMessage(data);
}


/* =====================================================
   REALTIME
===================================================== */

function subscribeRealtime(){

  if(!selectedConversation){

    return;
  }

  if(realtimeChannel){

    supabaseClient
    .removeChannel(
      realtimeChannel
    );

    realtimeChannel =
    null;
  }

  const conversationId =
  selectedConversation.id;

  realtimeChannel =
  supabaseClient
  .channel(
    "chat-" +
    conversationId +
    "-" +
    Date.now()
  )
  .on(
    "postgres_changes",
    {
      event:"INSERT",
      schema:"public",
      table:"messages",
      filter:
        "conversation_id=eq." +
        conversationId
    },
    payload => {

      if(
        !payload.new ||
        !currentUser
      ){

        return;
      }

      /*
        নিজের message আগেই দেখানো হয়েছে।
      */

      if(
        payload.new.sender_id ===
        currentUser.id
      ){

        return;
      }

      /*
        অন্য conversation-এর message নয়।
      */

      if(
        selectedConversation &&
        payload.new.conversation_id ===
        selectedConversation.id
      ){

        renderMessage(
          payload.new
        );
      }

    }
  )
  .subscribe(
    status => {

      console.log(
        "Realtime:",
        status
      );

    }
  );
}


/* =====================================================
   CLOSE CHAT
===================================================== */

function closeChat(){

  app.classList.remove(
    "chat-open"
  );

  if(realtimeChannel){

    supabaseClient
    .removeChannel(
      realtimeChannel
    );

    realtimeChannel =
    null;
  }

  selectedUser = null;

  selectedConversation = null;

  disableMessageInput();

  messagesBox.innerHTML =
  `
  <div class="empty">
    একজন user নির্বাচন করে chat শুরু করো 💬
  </div>
  `;
}


/* =====================================================
   ENTER TO SEND
===================================================== */

function handleEnter(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    sendMessage();
  }
}


/* =====================================================
   MESSAGE AREA
===================================================== */

function showMessageArea(text){

  messagesBox.innerHTML =
  `
  <div class="empty">
    ${escapeHtml(text)}
  </div>
  `;
}


/* =====================================================
   SCROLL
===================================================== */

function scrollMessages(){

  messagesBox.scrollTop =
  messagesBox.scrollHeight;
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text){

  return String(text)

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );
}


/* =====================================================
   AUTH STATE
===================================================== */

supabaseClient.auth.onAuthStateChange(
  (event, session) => {

    setTimeout(
      async () => {

        if(session?.user){

          currentUser =
          session.user;

          await showChatApp();

        }else{

          currentUser = null;

          showLogin();
        }

      },
      0
    );

  }
);


/* =====================================================
   START
===================================================== */

checkUser();

</script>
