<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    -webkit-text-size-adjust:100%;
    touch-action:manipulation;
}

body{
    font-family:"Hind Siliguri",sans-serif;
    background:#f0f2f8;
    color:#25344a;
    padding-bottom:85px;
}

/* HEADER */

.header{
    height:65px;
    background:#ffffff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
    border-top:3px solid #ff3d56;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:20px;
    font-weight:700;
    letter-spacing:.5px;
    color:#1f2d49;
}

.logo-icon{
    color:#ef2f61;
    font-size:26px;
}

.logo span{
    color:#ef2f61;
}

.menu-btn{
    width:40px;
    height:40px;
    border:none;
    background:#fff0f3;
    color:#ef2f61;
    border-radius:12px;
    font-size:22px;
    cursor:pointer;
}

/* TOP BUTTONS */

.top-links{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    padding:10px;
    background:#ffffff;
}

.top-btn{
    text-decoration:none;
    background:#ff3d56;
    color:white;
    padding:9px 3px;
    border-radius:8px;
    text-align:center;
    font-size:11px;
    font-weight:700;
    box-shadow:0 5px 12px rgba(255,61,86,.22);
}

.top-btn:active{
    transform:scale(.96);
}

/* HERO */

.hero{
    padding:25px 15px 15px;
    text-align:center;
}

.hero h1{
    font-family:"Roboto Slab",serif;
    font-size:23px;
    color:#30435c;
}

.hero p{
    color:#738096;
    font-size:13px;
    margin-top:4px;
}

/* SECTION */

.section-title{
    font-family:"Roboto Slab",serif;
    text-align:center;
    font-size:20px;
    color:#30435c;
    margin:18px 0;
}

/* SERVICES */

.services{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px 10px;
    padding:0 14px;
}

.service{
    border:none;
    background:transparent;
    font-family:inherit;
    cursor:pointer;
    color:#33445b;
    text-align:center;
}

.service-image{
    width:100%;
    aspect-ratio:1/1;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:37px;
    margin-bottom:6px;
    background:linear-gradient(145deg,#3a174b,#ff2d74);
    box-shadow:0 7px 15px rgba(0,0,0,.13);
    border:1px solid rgba(255,255,255,.35);
}

.service:nth-child(2) .service-image,
.service:nth-child(5) .service-image,
.service:nth-child(8) .service-image{
    background:linear-gradient(145deg,#0c5e98,#39b9ed);
}

.service:nth-child(3) .service-image,
.service:nth-child(6) .service-image{
    background:linear-gradient(145deg,#703510,#e8a12d);
}

.service:nth-child(4) .service-image,
.service:nth-child(7) .service-image{
    background:linear-gradient(145deg,#56348c,#a76dff);
}

.service-title{
    font-family:"Roboto Slab",serif;
    font-size:11px;
    font-weight:600;
    line-height:1.3;
    min-height:32px;
}

.service:active{
    transform:scale(.96);
}

/* SIDE MENU */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    opacity:0;
    visibility:hidden;
    transition:.3s;
    z-index:998;
}

.overlay.active{
    opacity:1;
    visibility:visible;
}

.side-menu{
    position:fixed;
    top:0;
    right:-300px;
    width:280px;
    max-width:82%;
    height:100vh;
    background:#ffffff;
    z-index:999;
    padding:20px 15px;
    transition:.35s;
    box-shadow:-10px 0 30px rgba(0,0,0,.15);
}

.side-menu.active{
    right:0;
}

.menu-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.menu-header h2{
    color:#ef2f61;
}

.close-menu{
    border:none;
    width:38px;
    height:38px;
    border-radius:50%;
    background:#fff0f3;
    color:#ef2f61;
    font-size:22px;
}

.menu-item{
    width:100%;
    border:none;
    background:#f5f6fa;
    padding:15px;
    margin-bottom:10px;
    border-radius:14px;
    display:flex;
    align-items:center;
    gap:10px;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    color:#33445b;
    cursor:pointer;
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:72px;
    background:#ffffff;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    border-radius:22px 22px 0 0;
    box-shadow:0 -5px 20px rgba(0,0,0,.10);
    z-index:500;
}

.nav-item{
    border:none;
    background:transparent;
    color:#657084;
    font-family:inherit;
    font-size:10px;
    font-weight:600;
    display:flex;

    justify-content:center;
    gap:2px;
}

.nav-icon{
    font-size:22px;
}

.nav-item.active{
    color:#ef2f61;
}

/* DETAIL PAGE */

#detailPage{
    display:none;

.detail-hero p{

.detail-content{
    padding:0 15px;

    background:#ffffff;

    padding:17px;

.detail-box p{

/* OPEN DETAIL PAGE */

function openPage(name){

closeMenu();

let page=pages[name];

if(!page)return;

document.getElementById("homePage")
.style.display="none";

document.getElementById("detailPage")
.style.display="block";

document.getElementById("detailIcon")
.innerHTML=page.icon;

document.getElementById("detailTitle")
.innerHTML=page.title;

document.getElementById("headerTitle")
.innerHTML=page.title;

document.getElementById("detailSubtitle")
.innerHTML=page.subtitle;

document.getElementById("detailContent")
.innerHTML=page.content;

window.scrollTo(0,0);

}


/* HOME */

function goHome(){

document.getElementById("detailPage")
.style.display="none";

document.getElementById("homePage")
.style.display="block";

window.scrollTo(0,0);

}


/* SERVICES */

function scrollToServices(){

goHome();

setTimeout(function(){

document.querySelector(".services")
.scrollIntoView({
behavior:"smooth"
});

},100);

}


/* BACK BUTTON */

window.onpopstate=function(){

goHome();

};


/* DOUBLE TAP ZOOM BLOCK */

let lastTouchEnd=0;

document.addEventListener(

"touchend",

function(event){

let now=new Date().getTime();

if(now-lastTouchEnd<=300){

event.preventDefault();

}

lastTouchEnd=now;

},

false

);

</script>
