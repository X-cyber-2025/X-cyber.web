<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>PIYAS SERVICES</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.googleapis.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Roboto+Slab:wght@500;600;700;800&display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    -webkit-text-size-adjust:100%;
    scroll-behavior:smooth;
}

body{
    font-family:"Hind Siliguri",sans-serif;
    background:#f0f2f8;
    color:#25344a;
    padding-bottom:85px;
    overflow-x:hidden;
    touch-action:pan-y;
}

button,
.service{
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
}


/* ================= HEADER ================= */

.header{
    height:72px;
    background:#ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 16px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
    border-top:3px solid #ff3d56;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    display:flex;
    align-items:center;
    gap:7px;
    font-family:"Roboto Slab",serif;
    font-size:21px;
    font-weight:800;
    letter-spacing:.5px;
    color:#1f2d49;
}

.logo-icon{
    font-size:28px;
}

.logo span:last-child{
    color:#ef2f61;
}


/* ================= TOP LINKS ================= */

.top-links{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    padding:10px 12px;
    background:#ffffff;
}

.top-btn{
    text-decoration:none;
    background:#ff3d56;
    color:#ffffff;
    padding:10px 4px;
    border-radius:9px;
    text-align:center;
    font-size:11px;
    font-weight:700;
    box-shadow:0 5px 12px rgba(255,61,86,.22);
}

.top-btn:active{
    transform:scale(.96);
}


/* ================= HERO ================= */

.hero{
    padding:25px 15px 16px;
    text-align:center;
}

.hero h1{
    font-family:"Roboto Slab",serif;
    font-size:24px;
    letter-spacing:.5px;
    color:#30435c;
}

.hero p{
    color:#738096;
    font-size:14px;
    margin-top:5px;
}


/* ================= SECTION TITLE ================= */

.section-title{
    font-family:"Roboto Slab",serif;
    text-align:center;
    font-size:22px;
    letter-spacing:1px;
    color:#30435c;
    margin:14px 0 20px;
}


/* ================= SERVICE GRID ================= */

.services{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px 12px;
    padding:0 15px 20px;
}

.service{
    border:none;
    background:transparent;
    font-family:inherit;
    cursor:pointer;
    color:#33445b;
    text-align:center;
    min-width:0;
}

.service-image{
    width:100%;
    aspect-ratio:1/1;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:8px;
    position:relative;
    overflow:hidden;
    border:2px solid rgba(255,255,255,.75);

    box-shadow:
    0 8px 18px rgba(0,0,0,.15),
    inset 0 1px 0 rgba(255,255,255,.6);

    transition:.2s ease;
}

.service-image::before{
    content:"";
    position:absolute;
    width:150%;
    height:150%;
    top:-55%;
    left:-45%;

    background:
    radial-gradient(
        circle,
        rgba(255,255,255,.20),
        transparent 58%
    );

    pointer-events:none;
}

.service-image::after{
    content:"";
    position:absolute;
    inset:0;

    background:
    linear-gradient(
        180deg,
        rgba(255,255,255,.12),
        transparent 45%
    );

    pointer-events:none;
}

.service:active .service-image{
    transform:scale(.96);
}


/* ================= COMMON LOGO ================= */

.service-logo{
    width:56px !important;
    height:56px !important;
    max-width:56px;
    max-height:56px;
    object-fit:contain;
    position:relative;
    z-index:5;

    filter:
    drop-shadow(
        0 5px 7px rgba(0,0,0,.22)
    );
}


/* ================= GOOGLE PLAY ================= */

.play-service .service-image{
    background:
    linear-gradient(
        145deg,
        #45165c,
        #e5005d
    );
}


/* ================= PARK ON ================= */

.park-service .service-image{
    background:
    linear-gradient(
        145deg,
        #fafaf7,
        #e6e4dd
    );
}

.park-logo{
    width:60px;
    height:60px;
    position:relative;
    z-index:5;
    border-radius:50%;

    background:
    conic-gradient(
        from 210deg,
        #ee8d9c,
        #65b8e8,
        #57c78c,
        #e3a92d,
        #efcc55,
        #56c58d,
        #ee8d9c
    );

    padding:5px;

    box-shadow:
    0 6px 12px rgba(0,0,0,.20);
}

.park-logo::before{
    content:"";
    position:absolute;
    inset:5px;
    border-radius:50%;
    background:#ffffff;
}

.park-medal{
    position:absolute;
    width:42px;
    height:42px;
    left:9px;
    top:9px;
    border-radius:50%;

    background:
    radial-gradient(
        circle at 35% 30%,
        #ffe4aa,
        #e4ad72 55%,
        #c9844f
    );

    border:3px solid rgba(255,255,255,.85);

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:4;

    box-shadow:
    0 5px 9px rgba(0,0,0,.22);
}

.park-star{
    color:#6d4327;
    font-size:27px;
    font-weight:900;
}

.park-ribbon{
    position:absolute;
    width:18px;
    height:25px;
    left:21px;
    bottom:0;
    z-index:3;

    background:
    linear-gradient(
        90deg,
        #a94550,
        #dc777d
    );

    clip-path:
    polygon(
        0 0,
        100% 0,
        100% 100%,
        50% 80%,
        0 100%
    );
}


/* ================= GOOGLE PLAY OFFER ================= */

.offer-service .service-image{
    background:
    radial-gradient(
        circle at center,
        #214886 0%,
        #13285b 55%,
        #09122d 100%
    );

    border:2px solid rgba(255,205,50,.75);
}

.offer-logo{
    width:64px;
    height:64px;
    position:relative;
    z-index:5;
}

.offer-bag{
    position:absolute;
    width:47px;
    height:38px;
    left:8px;
    bottom:5px;

    border-radius:8px 8px 11px 11px;

    background:
    linear-gradient(
        135deg,
        #08bff5,
        #00d477 45%,
        #ffb300
    );

    box-shadow:
    0 5px 9px rgba(0,0,0,.25);
}

.offer-handle{
    position:absolute;
    width:25px;
    height:20px;
    left:19px;
    top:1px;

    border:5px solid #ffffff;
    border-bottom:none;
    border-radius:18px 18px 0 0;

    z-index:3;
}

.offer-percent{
    position:absolute;
    left:18px;
    top:12px;
    z-index:5;

    color:#ffffff;
    font-family:Arial,sans-serif;
    font-size:27px;
    font-weight:900;
}

.offer-tag{
    position:absolute;
    right:-3px;
    top:21px;
    z-index:7;

    padding:4px 5px;

    background:#ef3030;
    color:#ffffff;

    border-radius:5px;

    font-size:6px;
    font-weight:900;

    transform:rotate(28deg);
}


/* ================= GMAIL ================= */

.gmail-service .service-image{
    background:
    linear-gradient(
        145deg,
        #ff5672,
        #c70d48
    );
}


/* ================= TELEGRAM ================= */

.telegram-service .service-image{
    background:
    linear-gradient(
        145deg,
        #24c7ed,
        #0788c8
    );
}


/* ================= QUEST ================= */

.quest-service .service-image{
    background:
    linear-gradient(
        145deg,
        #72d39a,
        #339d72
    );
}

.quest-logo{
    width:64px;
    height:58px;
    position:relative;
    z-index:5;
}

.quest-lid{
    position:absolute;
    width:56px;
    height:23px;
    left:4px;
    top:4px;

    border-radius:
    15px 15px 5px 5px;

    background:
    linear-gradient(
        145deg,
        #fff39b,
        #ffb300
    );

    border:2px solid #d98b00;
}

.quest-body{
    position:absolute;
    width:58px;
    height:32px;
    left:3px;
    top:26px;

    background:
    linear-gradient(
        145deg,
        #ffe269,
        #e99900
    );

    border-radius:
    3px 3px 8px 8px;
}

.quest-green{
    position:absolute;
    width:42px;
    height:24px;
    left:11px;
    top:30px;
    z-index:2;

    background:
    linear-gradient(
        145deg,
        #14996d,
        #075f4c
    );

    border-radius:3px;
}

.quest-lock{
    position:absolute;
    width:14px;
    height:15px;
    left:25px;
    top:27px;
    z-index:6;

    background:#ffd92d;
    border:2px solid #a96e00;
    border-radius:3px;
}

.quest-star{
    position:absolute;
    right:2px;
    top:0;
    z-index:8;

    color:#ffffff;
    font-size:17px;
}


/* ================= TIKTOK ================= */

.tiktok-service .service-image{
    background:
    linear-gradient(
        145deg,
        #242424,
        #050505
    );
}

.tiktok-logo-img{
    width:56px !important;
    height:56px !important;
    object-fit:contain;
    position:relative;
    z-index:5;

    filter:
    drop-shadow(
        0 5px 7px rgba(0,0,0,.35)
    );
}


/* ================= YOUTUBE ================= */

.youtube-service .service-image{
    background:#ffffff;
    border:2px solid #eeeeee;
}


/* ================= FUTURISTIC VPN ================= */

.vpn-service .service-image{
    background:
    radial-gradient(
        circle at 50% 48%,
        #073f9f 0%,
        #031f5c 38%,
        #020d2b 72%,
        #000817 100%
    );

    border:2px solid rgba(25,223,255,.75);
}


/* VPN LOGO */

.vpn-logo{
    width:100%;
    height:100%;
    min-height:120px;

    position:relative;
    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 50% 48%,
            #073f9f 0%,
            #031f5c 38%,
            #020d2b 72%,
            #000817 100%
        );

    isolation:isolate;
}


/* NEON OUTER BORDER */

.vpn-border{
    position:absolute;

    inset:5px;

    border:2px solid #19dfff;

    border-radius:18px;

    box-shadow:
        0 0 5px #19dfff,
        0 0 12px rgba(0,217,255,.9),
        inset 0 0 12px rgba(0,153,255,.3);

    z-index:10;

    pointer-events:none;
}

.vpn-border::before{
    content:"";

    position:absolute;

    inset:2px;

    border:1px solid rgba(255,255,255,.55);

    border-radius:15px;
}


/* BACKGROUND GLOW */

.vpn-glow{
    position:absolute;

    width:150px;
    height:150px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,194,255,.5),
            rgba(0,89,255,.22) 42%,
            transparent 72%
        );

    filter:blur(18px);

    z-index:-1;
}


/* SHIELD */

.vpn-shield{
    position:absolute;

    width:112px;
    height:118px;

    left:50%;
    top:51%;

    transform:translate(-50%,-50%);

    background:
        linear-gradient(
            145deg,
            #f4ffff 0%,
            #45eaff 12%,
            #008dff 38%,
            #124de8 68%,
            #00dfff 100%
        );

    clip-path:polygon(
        50% 0,
        93% 17%,
        89% 57%,
        75% 79%,
        50% 100%,
        25% 79%,
        11% 57%,
        7% 17%
    );

    filter:
        drop-shadow(0 0 7px #00dfff)
        drop-shadow(0 9px 12px rgba(0,0,0,.7));

    z-index:2;
}


/* SHIELD INNER */

.vpn-shield-inner{
    position:absolute;

    inset:6px;

    background:
        linear-gradient(
            145deg,
            #041b4a,
            #021039 45%,
            #00236c 72%,
            #06133c
        );

    clip-path:polygon(
        50% 0,
        93% 17%,
        89% 57%,
        75% 79%,
        50% 100%,
        25% 79%,
        11% 57%,
        7% 17%
    );
}

.vpn-shield-inner::before{
    content:"";

    position:absolute;

    width:100%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent 48%,
            rgba(0,217,255,.16) 50%,
            transparent 52%
        );

    opacity:.7;
}


/* VPN TEXT */

.vpn-title{
    position:relative;

    z-index:8;

    margin-top:3px;

    font-family:
        Impact,
        Haettenschweiler,
        "Arial Narrow Bold",
        "Arial Black",
        sans-serif;

    font-size:clamp(48px,14vw,76px);

    font-weight:900;

    line-height:.85;

    letter-spacing:-2px;

    transform:
        skew(-4deg)
        scaleX(1.04);

    color:#ffffff;

    -webkit-text-stroke:2px #061b49;

    text-shadow:

        2px 2px 0 #b9fbff,

        3px 4px 0 #168fff,

        5px 6px 0 #0636a5,

        7px 9px 0 #020b25,

        0 0 8px rgba(0,217,255,.9),

        0 12px 16px rgba(0,0,0,.8);
}


/* Metallic highlight */

.vpn-title::before{
    content:"VPN";

    position:absolute;

    left:0;
    top:0;

    color:transparent;

    background:
        linear-gradient(
            180deg,
            #ffffff 0%,
            #ffffff 24%,
            #d8faff 42%,
            #46dfff 68%,
            #007eff 100%
        );

    -webkit-background-clip:text;
    background-clip:text;

    -webkit-text-stroke:0;

    pointer-events:none;
}


/* ORBIT LIGHT */

.vpn-orbit{
    position:absolute;

    left:50%;
    top:50%;

    border-radius:50%;

    pointer-events:none;

    z-index:5;

    border:2px solid transparent;

    border-top-color:#28eaff;
    border-bottom-color:#00bfff;

    filter:
        drop-shadow(0 0 5px #00dfff);
}

.orbit-one{
    width:145px;
    height:50px;

    transform:
        translate(-50%,-50%)
        rotate(-17deg);
}

.orbit-two{
    width:155px;
    height:58px;

    transform:
        translate(-50%,-50%)
        rotate(18deg);

    opacity:.45;
}


/* BRIGHT LIGHT POINT */

.orbit-one::after{
    content:"";

    position:absolute;

    width:7px;
    height:7px;

    right:3px;
    top:1px;

    border-radius:50%;

    background:#ffffff;

    box-shadow:
        0 0 5px #ffffff,
        0 0 12px #00eaff,
        0 0 22px #00cfff;
}


/* GLOW DOTS */

.vpn-dot{
    position:absolute;

    width:4px;
    height:4px;

    border-radius:50%;

    background:#ffffff;

    box-shadow:
        0 0 5px #00eaff,
        0 0 10px #00aaff;

    z-index:6;

    animation:vpnDot 2s infinite alternate;
}

.dot-one{
    left:13%;
    top:35%;
}

.dot-two{
    right:13%;
    top:28%;

    animation-delay:.6s;
}

.dot-three{
    right:20%;
    bottom:22%;

    animation-delay:1s;
}

@keyframes vpnDot{
    from{
        opacity:.25;
        transform:scale(.7);
    }

    to{
        opacity:1;
        transform:scale(1.5);
    }
}


/* VPN RESPONSIVE */

@media(max-width:400px){

    .vpn-logo{
        min-height:100px;
    }

    .vpn-border{
        inset:4px;
        border-radius:15px;
    }

    .vpn-shield{
        width:82px;
        height:88px;
    }

    .vpn-title{
        font-size:48px;
        letter-spacing:-1px;

        -webkit-text-stroke:1.5px #061b49;

        text-shadow:
            2px 2px 0 #b9fbff,
            3px 4px 0 #168fff,
            5px 6px 0 #0636a5,
            6px 8px 0 #020b25,
            0 0 7px rgba(0,217,255,.9);
    }

    .orbit-one{
        width:120px;
        height:42px;
    }

    .orbit-two{
        width:130px;
        height:48px;
    }

}

/* ================= SELECT ADMIN ================= */

function selectAdmin(service,details){

    if(
        !details ||
        details.trim()===""
    ){

        alert(
            "দয়া করে প্রয়োজনীয় তথ্য নির্বাচন অথবা লিখুন।"
        );

        return;

    }

    openPage("contact");

    setTimeout(function(){

        const box=
        document.getElementById(
            "orderMessage"
        );

        if(box){

            box.value=

`🛒 নতুন অর্ডার

📌 সার্ভিস: ${service}

📝 বিস্তারিত: ${details}

আমি এই সার্ভিসটি নিতে চাই। বিস্তারিত জানাবেন।`;

        }

        const title=
        document.getElementById(
            "contactTitle"
        );

        if(title){

            title.innerText=
            "🛒 অর্ডার সম্পন্ন করুন";

        }

        window.scrollTo({

            top:document.body.scrollHeight,

            behavior:"smooth"

        });

    },300);

}


/* ================= WHATSAPP ================= */

function sendWhatsAppTo(number){

    const box=
    document.getElementById(
        "orderMessage"
    );

    if(
        !box ||
        !box.value.trim()
    ){

        alert(
            "দয়া করে অর্ডারের বিস্তারিত লিখুন।"
        );

        return;

    }

    const url=
    "https://wa.me/" +
    number +
    "?text=" +
    encodeURIComponent(
        box.value
    );

    window.open(
        url,
        "_blank"
    );

}


/* ================= CUSTOM PLAY OFFER ================= */

    const details=
    document.getElementById(

    if(details===""){

/* ================= OPEN PAGE ================= */

function openPage(
    name,
    addHistory=true
){

    const page=pages[name];

    if(!page){
        return;
    }

    document.getElementById(
        "homePage"
    ).style.display="none";

    document.getElementById(
        "detailPage"
    ).style.display="block";

    document.getElementById(
        "detailIcon"
    ).innerText=page.icon;

    document.getElementById(
        "detailTitle"
    ).innerText=page.title;

    document.getElementById(
        "headerTitle"
    ).innerText=page.title;

    document.getElementById(
        "detailSubtitle"
    ).innerText=page.subtitle;

    document.getElementById(
        "detailContent"
    ).innerHTML=page.content;

    currentPage=name;

    localStorage.setItem(
        "currentPage",
        name
    );

    if(addHistory){

        history.pushState(
            {page:name},
            "",
            "#" + name
        );

    }

    window.scrollTo(0,0);

}


/* ================= HOME ================= */

function goHome(){

    document.getElementById(
        "detailPage"
    ).style.display="none";

    document.getElementById(
        "homePage"
    ).style.display="block";

    currentPage=null;

    localStorage.removeItem(
        "currentPage"
    );

    history.pushState(
        {},
        "",
        window.location.pathname
    );

    window.scrollTo(0,0);

}


/* ================= SERVICES ================= */

function scrollToServices(){

    if(currentPage){

        goHome();

        setTimeout(function(){

            document.getElementById(
                "mainServices"
            ).scrollIntoView({

                behavior:"smooth"

            });

        },100);

        return;

    }

    document.getElementById(
        "mainServices"
    ).scrollIntoView({

        behavior:"smooth"

    });

}


/* ================= BROWSER BACK ================= */

window.addEventListener(
"popstate",
function(event){

    if(
        event.state &&
        event.state.page
    ){

        openPage(
            event.state.page,
            false
        );

    }else{

        document.getElementById(
            "detailPage"
        ).style.display="none";

        document.getElementById(
            "homePage"
        ).style.display="block";

        currentPage=null;

    }

});


/* ================= RESTORE PAGE ================= */

window.addEventListener(
"load",
function(){

    const savedPage=
    localStorage.getItem(
        "currentPage"
    );

    if(
        savedPage &&
        pages[savedPage]
    ){

        openPage(
            savedPage,
            false
        );

    }

});


/* ================= INITIAL HISTORY ================= */

if(!history.state){

    history.replaceState(
        {},
        "",
        window.location.href
    );

}


/* ================= PREVENT DOUBLE TAP ZOOM ================= */

let lastTouch=0;

document.addEventListener(
"touchend",
function(event){

    const now=Date.now();

    if(
        now-lastTouch<=300
    ){

        event.preventDefault();

    }

    lastTouch=now;

},
{
    passive:false
});


/* ================= PREVENT PINCH ZOOM ================= */

document.addEventListener(
"gesturestart",
function(event){

    event.preventDefault();

});

</script>
