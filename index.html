<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>PIYAS SERVICES</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Roboto+Slab:wght@500;600;700&display=swap"
rel="stylesheet">

<style>

/* ================= RESET ================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    -webkit-text-size-adjust:100%;
    scroll-behavior:smooth;
}

body{
    font-family:"Hind Siliguri",sans-serif;
    background:#f0f2f8;
    color:#25344a;
    padding-bottom:85px;
    overflow-x:hidden;
}


/* ================= HEADER ================= */

.header{
    height:72px;
    background:#ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 16px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
    border-top:3px solid #ff3d56;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:21px;
    font-weight:700;
    letter-spacing:.5px;
    color:#1f2d49;
}

.logo-icon{
    font-size:27px;
}

.logo span:last-child{
    color:#ef2f61;
}


/* ================= TOP LINKS ================= */

.top-links{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    padding:10px 12px;
    background:#ffffff;
}

.top-btn{
    text-decoration:none;
    background:#ff3d56;
    color:#ffffff;
    padding:10px 4px;
    border-radius:9px;
    text-align:center;
    font-size:11px;
    font-weight:700;
    box-shadow:0 5px 12px rgba(255,61,86,.22);
}

.top-btn:active{
    transform:scale(.96);
}


/* ================= HERO ================= */

.hero{
    padding:25px 15px 16px;
    text-align:center;
}

.hero h1{
    font-family:"Roboto Slab",serif;
    font-size:24px;
    letter-spacing:.5px;
    color:#30435c;
}

.hero p{
    color:#738096;
    font-size:14px;
    margin-top:5px;
}


/* ================= SECTION TITLE ================= */

.section-title{
    font-family:"Roboto Slab",serif;
    text-align:center;
    font-size:22px;
    letter-spacing:1px;
    color:#30435c;
    margin:14px 0 20px;
}


/* ================= SERVICE GRID ================= */

.services{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px 12px;
    padding:0 15px 20px;
}

.service{
    border:none;
    background:transparent;
    font-family:inherit;
    cursor:pointer;
    color:#33445b;
    text-align:center;
}

.service-image{
    width:100%;
    aspect-ratio:1/1;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:8px;
    background:linear-gradient(145deg,#3a174b,#ff2d74);
    box-shadow:0 8px 18px rgba(0,0,0,.15);
    border:1px solid rgba(255,255,255,.4);
    overflow:hidden;
    position:relative;
    transition:.25s ease;
}

.service-image::before{
    content:"";
    position:absolute;
    width:150%;
    height:150%;
    background:radial-gradient(
        circle,
        rgba(255,255,255,.18),
        transparent 58%
    );
    top:-50%;
    left:-50%;
    pointer-events:none;
}

.service-logo{
    width:62%;
    height:62%;
    object-fit:contain;
    position:relative;
    z-index:2;
    filter:drop-shadow(0 8px 10px rgba(0,0,0,.25));
}

.service:active .service-image{
    transform:scale(.96);
}


/* ================= SERVICE COLORS ================= */

.play-service .service-image{
    background:linear-gradient(145deg,#45165c,#e5005d);
}

.gmail-service .service-image{
    background:linear-gradient(145deg,#521541,#ff1760);
}

.telegram-service .service-image{
    background:linear-gradient(145deg,#0877a8,#35b5e8);
}

.quest-service .service-image{
    background:linear-gradient(135deg,#6fc490,#3b9e72);
}

.tiktok-service .service-image{
    background:linear-gradient(145deg,#050505,#303030);
}

.youtube-service .service-image{
    background:linear-gradient(145deg,#ff1111,#d80000);
}

.vpn-service .service-image{
    background:linear-gradient(145deg,#43307f,#8554d8);
}

.whyus-service .service-image{
    background:linear-gradient(145deg,#581044,#e91668);
}

/* ================= PARK ON LOGO ================= */

.park-service .service-image{

.park-ribbon{

}

.park-medal{

.park-star{

.play-discount-logo::before{

        rgba(0,220,255,.35),

}

.play-discount-logo::after{
    content:"";

    inset:5px;
    border-radius:15px;
    border:1px solid rgba(255,194,0,.55);
}

.discount-spark{
    position:absolute;
    z-index:6;
    color:#fff3a0;
    animation:discountSpark 1.8s infinite alternate;
}

.discount-spark.s1{
    top:15%;

}

.discount-spark.s2{
    top:27%;

}

.discount-spark.s3{
    bottom:38%;
    left:10%;
}

.discount-spark.s4{
    bottom:26%;
    right:14%;
}

@keyframes discountSpark{

    from{
        transform:scale(.65);
        opacity:.4;
    }

    to{
        transform:scale(1.2);
        opacity:1;
    }

}

}


/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:72px;
    background:#ffffff;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    border-radius:22px 22px 0 0;
    box-shadow:0 -5px 20px rgba(0,0,0,.10);
    z-index:500;
}

/* ================= SELECT ADMIN ================= */

function selectAdmin(service,details){

    if(!details || details.trim() === ""){

        alert(
            "দয়া করে প্রয়োজনীয় তথ্য নির্বাচন অথবা লিখুন।"

    openPage("contact");

    setTimeout(function(){

        let message =

        "🛒 নতুন অর্ডার\n\n" +

        "📌 সার্ভিস: " +
        service +

        "\n\n" +

        "📝 বিস্তারিত: " +
        details +

        "\n\n" +

        "আমি এই সার্ভিসটি নিতে চাই। বিস্তারিত জানাবেন।";


        document.getElementById(
            "orderMessage"
        ).value = message;


        document.getElementById(
            "contactTitle"
        ).innerText =
        "🛒 অর্ডার সম্পন্ন করুন";


        window.scrollTo({

            top:document.body.scrollHeight,

            behavior:"smooth"

        });

    },300);

}


/* ================= WHATSAPP ================= */

function sendWhatsAppTo(number){

    let message =
    document.getElementById(
        "orderMessage"
    ).value.trim();


    if(message === ""){

        alert(
            "দয়া করে অর্ডারের বিস্তারিত লিখুন।"
        );

        return;

    }


    let url =
    "https://wa.me/" +
    number +
    "?text=" +
    encodeURIComponent(message);


    window.open(
        url,
        "_blank"
    );

}

/* ================= PAGE OPEN ================= */

function openPage(name,addHistory=true){

    let page = pages[name];

    if(!page){
        return;
    }

    document.getElementById(
        "homePage"
    ).style.display = "none";

    document.getElementById(
        "detailPage"
    ).style.display = "block";

    document.getElementById(
        "detailIcon"
    ).innerText = page.icon;

    document.getElementById(
        "detailTitle"
    ).innerText = page.title;

    document.getElementById(
        "headerTitle"
    ).innerText = page.title;

    document.getElementById(
        "detailSubtitle"
    ).innerText = page.subtitle;

    document.getElementById(
        "detailContent"
    ).innerHTML = page.content;

    currentPage = name;

    localStorage.setItem(
        "currentPage",
        name
    );

    if(addHistory){

        history.pushState(
            {page:name},
            "",
            "#" + name
        );

    }

    window.scrollTo(0,0);

}


/* ================= HOME ================= */

function showHome(addHistory=true){

    document.getElementById(
        "detailPage"
    ).style.display = "none";

    document.getElementById(
        "homePage"
    ).style.display = "block";

    currentPage = null;

    localStorage.removeItem(
        "currentPage"
    );

    if(addHistory){

        history.pushState(
            {},
            "",
            window.location.pathname
        );

    }

    window.scrollTo(0,0);

}


/* ================= GO HOME ================= */

function goHome(){

    if(currentPage !== null){

        showHome();

    }else{

        showHome(false);

    }

}


/* ================= SERVICES ================= */

function scrollToServices(){

    if(currentPage !== null){

        showHome(false);

        setTimeout(function(){

            document.getElementById(
                "mainServices"
            ).scrollIntoView({

                behavior:"smooth"

            });

        },100);

        return;

    }

    document.getElementById(
        "mainServices"
    ).scrollIntoView({

        behavior:"smooth"

    });

}


/* ================= BROWSER BACK ================= */

window.addEventListener(
"popstate",
function(event){

    if(event.state && event.state.page){

        openPage(
            event.state.page,
            false
        );

    }else{

        showHome(false);

    }

});


/* ================= PAGE RESTORE ================= */

window.addEventListener(
"load",
function(){

    let savedPage =
    localStorage.getItem(
        "currentPage"
    );

    if(
        savedPage &&
        pages[savedPage]
    ){

        openPage(
            savedPage,
            false
        );

    }

});


/* ================= INITIAL HISTORY ================= */

if(!history.state){

    history.replaceState(
        {},
        "",
        window.location.href
    );

}

</script>
