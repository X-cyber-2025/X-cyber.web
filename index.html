<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Piyas Chat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #f3f4f6;
      min-height: 100vh;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    /* =========================
       APP
    ========================= */

    .app {
      width: 100%;
      max-width: 1100px;
      height: 100vh;
      margin: auto;
      background: #ffffff;
      display: flex;
      overflow: hidden;
    }

    /* =========================
       LOGIN
    ========================= */

    .auth {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-box {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .auth-input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 12px;
      outline: none;
      font-size: 15px;
    }

    .auth-input:focus {
      border-color: #22c55e;
    }

    .primary {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      background: #16a34a;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
    }

    .secondary {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      background: #f1f5f9;
      color: #111111;
      font-size: 15px;
    }

    .error {
      color: #dc2626;
      font-size: 14px;
      margin-bottom: 12px;
      min-height: 18px;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      width: 320px;
      height: 100%;
      border-right: 1px solid #eeeeee;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 18px;
      border-bottom: 1px solid #eeeeee;
    }

    .brand {
      font-size: 22px;
      font-weight: bold;
    }

    .my-email {
      color: #777777;
      font-size: 12px;
      margin-top: 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .logout {
      margin-top: 12px;
      padding: 8px 12px;
      background: #fee2e2;
      color: #dc2626;
      border-radius: 8px;
      font-size: 14px;
    }

    .users {
      flex: 1;
      overflow-y: auto;
    }

    .user {
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      border-bottom: 1px solid #f1f1f1;
    }

    .user:hover {
      background: #f8fafc;
    }

    .avatar {
      width: 45px;
      height: 45px;
      min-width: 45px;
      border-radius: 50%;
      background: #16a34a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
    }

    .user-name {
      font-weight: bold;
      color: #111111;
    }

    .user-status {
      font-size: 12px;
      color: #777777;
      margin-top: 3px;
    }

    /* =========================
       CHAT
    ========================= */

    .chat {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    .chat-header {
      height: 70px;
      min-height: 70px;
      border-bottom: 1px solid #eeeeee;
      display: flex;
      align-items: center;
      padding: 12px 18px;
      gap: 12px;
    }

    .chat-title {
      font-weight: bold;
      font-size: 18px;
    }

    .chat-subtitle {
      font-size: 12px;
      color: #22c55e;
      margin-top: 3px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f8fafc;
    }

    .empty {
      height: 100%;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999999;
      text-align: center;
      padding: 20px;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      margin-bottom: 10px;
      border-radius: 15px;
      line-height: 1.4;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .sent {
      margin-left: auto;
      background: #16a34a;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .received {
      margin-right: auto;
      background: #ffffff;
      color: #111111;
      border: 1px solid #eeeeee;
      border-bottom-left-radius: 4px;
    }

    .time {
      display: block;
      font-size: 10px;
      margin-top: 5px;
      opacity: 0.7;
    }

    /* =========================
       SEND AREA
    ========================= */

    .send-area {
      padding: 12px;
      border-top: 1px solid #eeeeee;
      display: flex;
      gap: 8px;
      background: #ffffff;
    }

    .message-input {
      width: auto;
      flex: 1;
      padding: 14px;
      border: 1px solid #dddddd;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
      margin: 0;
    }

    .message-input:focus {
      border-color: #22c55e;
    }

    .send-btn {
      width: 55px;
      min-width: 55px;
      border-radius: 10px;
      background: #16a34a;
      color: #ffffff;
      font-size: 20px;
    }

    .send-btn:disabled,
    .primary:disabled,
    .secondary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* =========================
       MOBILE BACK
    ========================= */

    .mobile-back {
      display: none;
      background: transparent;
      color: #111111;
      font-size: 25px;
      padding: 5px 10px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .app {
        width: 100%;
        height: 100vh;
        max-width: none;
      }

      .sidebar {
        width: 100%;
        height: 100%;
        display: flex;
      }

      .chat {
        width: 100%;
        height: 100%;
        display: none;
      }

      /*
        Chat open হলে sidebar hide
        এবং chat show হবে।
      */

      .app.chat-open .sidebar {
        display: none;
      }

      .app.chat-open .chat {
        display: flex;
      }

      .mobile-back {
        display: block;
      }

      .message {
        max-width: 85%;
      }

      .messages {
        padding: 15px;
      }

      .send-area {
        padding: 10px;
      }

      .auth-box {
        padding: 25px 20px;
      }
    }

    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 701px) {

      .sidebar {
        display: flex !important;
      }

      .chat {
        display: flex !important;
      }

      .mobile-back {
        display: none !important;
      }
    }
  </style>
</head>

<body>

  <div class="app" id="app">

    <!-- =====================
         LOGIN / REGISTER
    ====================== -->

    <section class="auth" id="auth">

      <div class="auth-box">

        <div class="logo">
          💬 Piyas Chat
        </div>

        <div class="subtitle">
          Private & Secure Chat
        </div>

        <div
          id="authError"
          class="error"
        ></div>

        <input
          class="auth-input"
          type="email"
          id="email"
          placeholder="Email address"
          autocomplete="email"
        >

        <input
          class="auth-input"
          type="password"
          id="password"
          placeholder="Password"
          autocomplete="current-password"
        >

        <button
          class="primary"
          id="loginBtn"
          onclick="login()"
        >
          Login
        </button>

        <button
          class="secondary"
          id="registerBtn"
          onclick="register()"
        >
          Create New Account
        </button>

      </div>

    </section>


    <!-- =====================
         SIDEBAR
    ====================== -->

    <aside
      class="sidebar"
      id="sidebar"
    >

      <div class="sidebar-header">

        <div class="brand">
          💬 Piyas Chat
        </div>

        <div
          class="my-email"
          id="myEmail"
        ></div>

        <button
          class="logout"
          onclick="logout()"
        >
          Logout
        </button>

      </div>

      <div
        class="users"
        id="users"
      >

        <div class="empty">
          Loading users...
        </div>

      </div>

    </aside>


    <!-- =====================
         CHAT
    ====================== -->

    <main
      class="chat"
      id="chat"
    >

      <div class="chat-header">

        <button
          class="mobile-back"
          onclick="closeChat()"
        >
          ←
        </button>

        <div
          class="avatar"
          id="chatAvatar"
        >
          ?
        </div>

        <div>

          <div
            class="chat-title"
            id="chatName"
          >
            Select a user
          </div>

          <div
            class="chat-subtitle"
            id="chatStatus"
          >
            Private Chat
          </div>

        </div>

      </div>


      <div
        class="messages"
        id="messages"
      >

        <div class="empty">
          একজন user নির্বাচন করে chat শুরু করো 💬
        </div>

      </div>


      <div class="send-area">

        <input
          class="message-input"
          type="text"
          id="messageInput"
          placeholder="Write a message..."
          onkeydown="handleEnter(event)"
          disabled
        >

        <button
          class="send-btn"
          id="sendBtn"
          onclick="sendMessage()"
          disabled
        >
          ➤
        </button>

      </div>

    </main>

  </div>


  <script>

    /* =====================================
       SUPABASE
    ===================================== */

    const SUPABASE_URL =
      "https://uthadawkcwfpwcfijooz.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_twbqcof2uApf1-VrkMnOLA_p2mArS6f";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================
       VARIABLES
    ===================================== */

    let currentUser = null;
    let selectedUser = null;
    let selectedConversation = null;
    let realtimeChannel = null;
    let openingChat = false;


    /* =====================================
       INPUT ENABLE
    ===================================== */

    function setChatInputEnabled(enabled) {

      document.getElementById(
        "messageInput"
      ).disabled = !enabled;

      document.getElementById(
        "sendBtn"
      ).disabled = !enabled;

    }


    /* =====================================
       ERROR
    ===================================== */

    function showError(message) {

      document.getElementById(
        "authError"
      ).textContent = message;

    }


    function clearError() {

      document.getElementById(
        "authError"
      ).textContent = "";

    }


    /* =====================================
       LOGIN SCREEN
    ===================================== */

    function showLogin() {

      document.getElementById(
        "auth"
      ).style.display = "flex";

      document.getElementById(
        "sidebar"
      ).style.display = "none";

      document.getElementById(
        "chat"
      ).style.display = "none";

      document.getElementById(
        "app"
      ).classList.remove("chat-open");

      setChatInputEnabled(false);

    }


    /* =====================================
       CHAT APP
    ===================================== */

    async function showChatApp() {

      if (!currentUser) {
        return;
      }

      document.getElementById(
        "auth"
      ).style.display = "none";

      /*
        Desktop:
        Sidebar + Chat

        Mobile:
        Sidebar first.
      */

      document.getElementById(
        "sidebar"
      ).style.display = "flex";

      document.getElementById(
        "chat"
      ).style.display = "flex";

      document.getElementById(
        "myEmail"
      ).textContent =
        currentUser.email || "";

      await ensureOwnProfile();

      await loadUsers();

    }


    /* =====================================
       CHECK USER
    ===================================== */

    async function checkUser() {

      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .getUser();

      if (error) {

        console.error(
          "Auth check:",
          error
        );

        showLogin();

        return;
      }

      if (
        data &&
        data.user
      ) {

        currentUser =
          data.user;

        await showChatApp();

      } else {

        showLogin();

      }

    }


    /* =====================================
       LOGIN
    ===================================== */

    async function login() {

      const email =
        document.getElementById(
          "email"
        ).value.trim();

      const password =
        document.getElementById(
          "password"
        ).value;

      clearError();

      if (
        !email ||
        !password
      ) {

        showError(
          "Email এবং password দাও"
        );

        return;
      }

      const button =
        document.getElementById(
          "loginBtn"
        );

      button.disabled = true;
      button.textContent =
        "Logging in...";

      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .signInWithPassword({

            email: email,
            password: password

          });

      button.disabled = false;
      button.textContent =
        "Login";

      if (error) {

        showError(
          error.message
        );

        return;
      }

      currentUser =
        data.user;

      await showChatApp();

    }


    /* =====================================
       REGISTER
    ===================================== */

    async function register() {

      const email =
        document.getElementById(
          "email"
        ).value.trim();

      const password =
        document.getElementById(
          "password"
        ).value;

      clearError();

      if (
        !email ||
        !password
      ) {

        showError(
          "Email এবং password দাও"
        );

        return;
      }

      if (
        password.length < 6
      ) {

        showError(
          "Password কমপক্ষে ৬ অক্ষরের হতে হবে"
        );

        return;
      }

      const button =
        document.getElementById(
          "registerBtn"
        );

      button.disabled = true;
      button.textContent =
        "Creating...";

      const {
        data,
        error
      } =
        await supabaseClient
          .auth
          .signUp({

            email: email,
            password: password

          });

      button.disabled = false;
      button.textContent =
        "Create New Account";

      if (error) {

        showError(
          error.message
        );

        return;
      }

      if (!data.user) {

        showError(
          "Account তৈরি করা যায়নি।"
        );

        return;
      }

      currentUser =
        data.user;

      if (data.session) {

        await showChatApp();

      } else {

        showError(
          "Account তৈরি হয়েছে। Email verification শেষ করে Login করো।"
        );

      }

    }


    /* =====================================
       LOGOUT
    ===================================== */

    async function logout() {

      if (realtimeChannel) {

        await supabaseClient
          .removeChannel(
            realtimeChannel
          );

        realtimeChannel = null;

      }

      await supabaseClient
        .auth
        .signOut();

      currentUser = null;
      selectedUser = null;
      selectedConversation = null;
      openingChat = false;

      showLogin();

    }


    /* =====================================
       PROFILE
    ===================================== */

    async function ensureOwnProfile() {

      if (!currentUser) {
        return;
      }

      const {
        data,
        error
      } =
        await supabaseClient
          .from("profiles")
          .select("id")
          .eq(
            "id",
            currentUser.id
          )
          .maybeSingle();

      if (error) {

        console.error(
          "Profile check:",
          error
        );

        return;
      }

      if (data) {
        return;
      }

      const base =
        (
          currentUser.email ||
          "user"
        )
          .split("@")[0]
          .replace(
            /[^a-zA-Z0-9_]/g,
            ""
          )
          .toLowerCase() ||
          "user";

      const username =
        base +
        "_" +
        currentUser.id.slice(
          0,
          6
        );

      const {
        error: insertError
      } =
        await supabaseClient
          .from("profiles")
          .insert({

            id:
              currentUser.id,

            username:
              username,

            display_name:
              base

          });

      if (
        insertError &&
        insertError.code !== "23505"
      ) {

        console.error(
          "Profile create:",
          insertError
        );

      }

    }


    /* =====================================
       LOAD USERS
    ===================================== */

    async function loadUsers() {

      const usersBox =
        document.getElementById(
          "users"
        );

      usersBox.innerHTML =
        `
        <div class="empty">
          Loading users...
        </div>
        `;

      if (!currentUser) {
        return;
      }

      const {
        data,
        error
      } =
        await supabaseClient
          .from("profiles")
          .select(
            "id, username, display_name, avatar_url"
          )
          .neq(
            "id",
            currentUser.id
          )
          .order(
            "username",
            {
              ascending: true
            }
          );

      if (error) {

        console.error(
          "Users:",
          error
        );

        usersBox.innerHTML =
          `
          <div class="empty">
            Users load করা যায়নি।<br><br>
            ${escapeHtml(
              error.message
            )}
          </div>
          `;

        return;
      }

      if (
        !data ||
        data.length === 0
      ) {

        usersBox.innerHTML =
          `
          <div class="empty">
            এখনো কোনো অন্য user নেই
          </div>
          `;

        return;
      }

      usersBox.innerHTML = "";

      data.forEach(
        user => {

          const name =
            user.display_name ||
            user.username ||
            "User";

          const first =
            name
              .charAt(0)
              .toUpperCase();

          const div =
            document.createElement(
              "div"
            );

          div.className =
            "user";

          div.innerHTML =
            `
            <div class="avatar">
              ${escapeHtml(first)}
            </div>

            <div>

              <div class="user-name">
                ${escapeHtml(name)}
              </div>

              <div class="user-status">
                @${escapeHtml(
                  user.username ||
                  "user"
                )}
              </div>

            </div>
            `;

          /*
            পুরো user row-তেই click
            কাজ করবে।
          */

          div.addEventListener(
            "click",
            function () {
              openChat(user);
            }
          );

          usersBox.appendChild(
            div
          );

        }
      );

    }


    /* =====================================
       OPEN CHAT
    ===================================== */

    async function openChat(user) {

      if (openingChat) {
        return;
      }

      openingChat = true;

      selectedUser =
        user;

      /*
        MOBILE CHAT OPEN
      */

      document.getElementById(
        "app"
      ).classList.add(
        "chat-open"
      );

      const name =
        user.display_name ||
        user.username ||
        "User";

      document.getElementById(
        "chatName"
      ).textContent =
        name;

      document.getElementById(
        "chatAvatar"
      ).textContent =
        name
          .charAt(0)
          .toUpperCase();

      document.getElementById(
        "chatStatus"
      ).textContent =
        "Private Chat";

      document.getElementById(
        "messages"
      ).innerHTML =
        `
        <div class="empty">
          Loading messages...
        </div>
        `;

      setChatInputEnabled(false);

      try {

        await findConversation();

      } catch (error) {

        console.error(
          "Open chat:",
          error
        );

        showMessageArea(
          "Chat খুলতে সমস্যা হয়েছে।"
        );

      } finally {

        openingChat =
          false;

      }

    }


    /* =====================================
       FIND / CREATE CONVERSATION
    ===================================== */

    async function findConversation() {

      selectedConversation =
        null;

      if (
        !currentUser ||
        !selectedUser
      ) {
        return;
      }

      /*
        আগে existing conversation খুঁজবে।
      */

      const {
        data,
        error
      } =
        await supabaseClient
          .from("conversations")
          .select(
            "id,user_one,user_two,created_at"
          )
          .or(
            `and(user_one.eq.${currentUser.id},user_two.eq.${selectedUser.id}),and(user_one.eq.${selectedUser.id},user_two.eq.${currentUser.id})`
          )
          .limit(1);

      if (error) {

        console.error(
          "Conversation search:",
          error
        );

        showMessageArea(
          "Conversation খুঁজে পাওয়া যায়নি: " +
          error.message
        );

        return;
      }

      if (
        data &&
        data.length > 0
      ) {

        selectedConversation =
          data[0];

      } else {

        /*
          নতুন conversation
        */

        const {
          data: newConversation,
          error: createError
        } =
          await supabaseClient
            .from("conversations")
            .insert({

              user_one:
                currentUser.id,

              user_two:
                selectedUser.id

            })
            .select(
              "id,user_one,user_two,created_at"
            )
            .single();

        if (createError) {

          console.error(
            "Conversation create:",
            createError
          );

          /*
            Duplicate হলে আবার খুঁজবে।
          */

          if (
            createError.code ===
            "23505"
          ) {

            const retry =
              await supabaseClient
                .from("conversations")
                .select(
                  "id,user_one,user_two,created_at"
                )
                .or(
                  `and(user_one.eq.${currentUser.id},user_two.eq.${selectedUser.id}),and(user_one.eq.${selectedUser.id},user_two.eq.${currentUser.id})`
                )
                .limit(1);

            if (
              retry.data &&
              retry.data.length > 0
            ) {

              selectedConversation =
                retry.data[0];

            } else {

              showMessageArea(
                "Conversation পাওয়া যায়নি।"
              );

              return;
            }

          } else {

            showMessageArea(
              "Conversation তৈরি করা যায়নি: " +
              createError.message
            );

            return;
          }

        } else {

          selectedConversation =
            newConversation;

        }

      }

      if (!selectedConversation) {

        showMessageArea(
          "Conversation পাওয়া যায়নি।"
        );

        return;
      }

      setChatInputEnabled(true);

      await loadMessages();

      subscribeRealtime();

    }


    /* =====================================
       LOAD MESSAGES
    ===================================== */

    async function loadMessages() {

      const box =
        document.getElementById(
          "messages"
        );

      if (!selectedConversation) {

        showMessageArea(
          "Conversation পাওয়া যায়নি।"
        );

        return;
      }

      box.innerHTML =
        `
        <div class="empty">
          Loading messages...
        </div>
        `;

      const {
        data,
        error
      } =
        await supabaseClient
          .from("messages")
          .select(
            "id,conversation_id,sender_id,content,created_at"
          )
          .eq(
            "conversation_id",
            selectedConversation.id
          )
          .order(
            "created_at",
            {
              ascending: true
            }
          );

      if (error) {

        console.error(
          "Messages:",
          error
        );

        showMessageArea(
          "Messages load করা যায়নি: " +
          error.message
        );

        return;
      }

      box.innerHTML = "";

      if (
        !data ||
        data.length === 0
      ) {

        box.innerHTML =
          `
          <div class="empty">
            কোনো message নেই।<br>
            প্রথম message পাঠাও 💬
          </div>
          `;

        return;
      }

      data.forEach(
        message => {

          renderMessage(
            message
          );

        }
      );

      scrollMessages();

    }


    /* =====================================
       RENDER MESSAGE
    ===================================== */

    function renderMessage(message) {

      const box =
        document.getElementById(
          "messages"
        );

      const empty =
        box.querySelector(
          ".empty"
        );

      if (empty) {
        box.innerHTML = "";
      }

      /*
        Duplicate আটকানো।
      */

      if (
        message.id &&
        box.querySelector(
          `[data-message-id="${message.id}"]`
        )
      ) {

        return;
      }

      const div =
        document.createElement(
          "div"
        );

      if (message.id) {

        div.dataset.messageId =
          message.id;

      }

      div.className =
        "message " +
        (
          message.sender_id ===
          currentUser.id
            ? "sent"
            : "received"
        );

      const time =
        new Date(
          message.created_at
        ).toLocaleTimeString(
          "bn-BD",
          {
            hour: "numeric",
            minute: "2-digit"
          }
        );

      div.innerHTML =
        `
        ${escapeHtml(
          message.content
        )}

        <span class="time">
          ${escapeHtml(time)}
        </span>
        `;

      box.appendChild(
        div
      );

      scrollMessages();

    }


    /* =====================================
       SEND MESSAGE
    ===================================== */

    async function sendMessage() {

      const input =
        document.getElementById(
          "messageInput"
        );

      const sendBtn =
        document.getElementById(
          "sendBtn"
        );

      const content =
        input.value.trim();

      if (
        !content ||
        !selectedConversation ||
        !currentUser
      ) {

        return;
      }

      input.value = "";

      sendBtn.disabled = true;

      const {
        data,
        error
      } =
        await supabaseClient
          .from("messages")
          .insert({

            conversation_id:
              selectedConversation.id,

            sender_id:
              currentUser.id,

            content:
              content

          })
          .select(
            "id,conversation_id,sender_id,content,created_at"
          )
          .single();

      sendBtn.disabled = false;

      input.focus();

      if (error) {

        console.error(
          "Send message:",
          error
        );

        alert(
          "Message পাঠানো যায়নি: " +
          error.message
        );

        input.value =
          content;

        return;
      }

      /*
        নিজের message সঙ্গে সঙ্গে দেখাবে।
      */

      renderMessage(
        data
      );

    }


    /* =====================================
       REALTIME
    ===================================== */

    function subscribeRealtime() {

      if (!selectedConversation) {
        return;
      }

      if (realtimeChannel) {

        supabaseClient
          .removeChannel(
            realtimeChannel
          );

        realtimeChannel =
          null;
      }

      const conversationId =
        selectedConversation.id;

      realtimeChannel =
        supabaseClient
          .channel(
            "chat-" +
            conversationId +
            "-" +
            Date.now()
          )
          .on(
            "postgres_changes",
            {
              event: "INSERT",
              schema: "public",
              table: "messages",
              filter:
                "conversation_id=eq." +
                conversationId
            },
            payload => {

              if (
                !payload.new ||
                !currentUser ||
                !selectedConversation
              ) {

                return;
              }

              /*
                অন্য user-এর message
                realtime-এ দেখাবে।
              */

              if (
                payload.new.sender_id !==
                currentUser.id
              ) {

                if (
                  payload.new.conversation_id ===
                  selectedConversation.id
                ) {

                  renderMessage(
                    payload.new
                  );

                }

              }

            }
          )
          .subscribe(
            status => {

              console.log(
                "Realtime:",
                status
              );

            }
          );

    }


    /* =====================================
       ENTER TO SEND
    ===================================== */

    function handleEnter(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }


    /* =====================================
       CLOSE CHAT
    ===================================== */

    function closeChat() {

      document.getElementById(
        "app"
      ).classList.remove(
        "chat-open"
      );

      if (realtimeChannel) {

        supabaseClient
          .removeChannel(
            realtimeChannel
          );

        realtimeChannel =
          null;

      }

      selectedUser = null;

      selectedConversation =
        null;

      setChatInputEnabled(false);

      document.getElementById(
        "chatName"
      ).textContent =
        "Select a user";

      document.getElementById(
        "chatAvatar"
      ).textContent =
        "?";

      document.getElementById(
        "messages"
      ).innerHTML =
        `
        <div class="empty">
          একজন user নির্বাচন করে chat শুরু করো 💬
        </div>
        `;

    }


    /* =====================================
       MESSAGE AREA
    ===================================== */

    function showMessageArea(text) {

      document.getElementById(
        "messages"
      ).innerHTML =
        `
        <div class="empty">
          ${escapeHtml(text)}
        </div>
        `;

    }


    /* =====================================
       SCROLL
    ===================================== */

    function scrollMessages() {

      const box =
        document.getElementById(
          "messages"
        );

      box.scrollTop =
        box.scrollHeight;

    }


    /* =====================================
       ESCAPE HTML
    ===================================== */

    function escapeHtml(text) {

      return String(text)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =====================================
       AUTH STATE
    ===================================== */

    supabaseClient.auth.onAuthStateChange(
      (event, session) => {

        setTimeout(
          async () => {

            if (session?.user) {

              currentUser =
                session.user;

              await showChatApp();

            } else {

              currentUser = null;

              showLogin();

            }

          },
          0
        );

      }
    );


    /* =====================================
       START
    ===================================== */

    checkUser();

  </script>
