/* ================= RESET ================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    -webkit-text-size-adjust:100%;
    scroll-behavior:smooth;
}

body{
    font-family:"Hind Siliguri",sans-serif;
    background:#f0f2f8;
    color:#25344a;
    padding-bottom:85px;
    overflow-x:hidden;
}

/* ================= HEADER ================= */

.header{
    height:72px;
    background:#ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 16px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
    border-top:3px solid #ff3d56;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:21px;
    font-weight:700;
    letter-spacing:.5px;
    color:#1f2d49;
}

.logo-icon{
    font-size:27px;
}

.logo span:last-child{
    color:#ef2f61;
}

/* ================= TOP LINKS ================= */

.top-links{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    padding:10px 12px;
    background:#ffffff;
}

.top-btn{
    text-decoration:none;
    background:#ff3d56;
    color:#ffffff;
    padding:10px 4px;
    border-radius:9px;
    text-align:center;
    font-size:11px;
    font-weight:700;
    box-shadow:0 5px 12px rgba(255,61,86,.22);
}

.top-btn:active{
    transform:scale(.96);
}

/* ================= HERO ================= */

.hero{
    padding:25px 15px 16px;
    text-align:center;
}

.hero h1{
    font-family:"Roboto Slab",serif;
    font-size:24px;
    letter-spacing:.5px;
    color:#30435c;
}

.hero p{
    color:#738096;
    font-size:14px;
    margin-top:5px;
}

/* ================= SECTION TITLE ================= */

.section-title{
    font-family:"Roboto Slab",serif;
    text-align:center;
    font-size:22px;
    letter-spacing:1px;
    color:#30435c;
    margin:14px 0 20px;
}

/* ================= SERVICE GRID ================= */

.services{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px 12px;
    padding:0 15px 20px;
}

.service{
    border:none;
    background:transparent;
    font-family:inherit;
    cursor:pointer;
    color:#33445b;
    text-align:center;
}

.service-image{
    width:100%;
    aspect-ratio:1/1;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    margin-bottom:7px;
    background:linear-gradient(145deg,#3a174b,#ff2d74);
    box-shadow:0 7px 15px rgba(0,0,0,.13);
    border:1px solid rgba(255,255,255,.35);
}

.service:nth-child(2) .service-image,
.service:nth-child(5) .service-image,
.service:nth-child(8) .service-image{
    background:linear-gradient(145deg,#0c5e98,#39b9ed);
}

.service:nth-child(3) .service-image,
.service:nth-child(6) .service-image,
.service:nth-child(9) .service-image{
    background:linear-gradient(145deg,#703510,#e8a12d);
}

.service:nth-child(4) .service-image,
.service:nth-child(7) .service-image{
    background:linear-gradient(145deg,#56348c,#a76dff);
}

.service-title{
    font-family:"Roboto Slab",serif;
    font-size:12px;
    font-weight:600;
    line-height:1.35;
    min-height:34px;
}

.service:active{
    transform:scale(.96);
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    height:72px;
    background:#ffffff;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    border-radius:22px 22px 0 0;
    box-shadow:0 -5px 20px rgba(0,0,0,.10);
    z-index:500;
}

.nav-item{
    border:none;
    background:transparent;
    color:#657084;
    font-family:inherit;
    font-size:11px;
    font-weight:600;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    cursor:pointer;
}

.nav-icon{
    font-size:22px;
}

.nav-item.active{
    color:#ef2f61;

/* ================= DETAIL PAGE ================= */

.detail-title-small{

    font-weight:700;

.detail-hero{

.detail-icon{

    height:70px;

    align-items:center;

.detail-hero h1{
    margin-top:12px;
    font-size:23px;
    color:#2e4058;
}

.detail-hero p{
    color:#718096;
    font-size:13px;
    margin-top:4px;
}

.detail-content{
    padding:0 15px;
    max-width:700px;
    margin:auto;
}

/* ================= DETAIL BOX ================= */

.detail-box{
    background:#ffffff;
    border-radius:18px;
    padding:17px;
    margin-bottom:14px;
    box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.detail-box h2{
    font-size:19px;
    color:#30435c;
    margin-bottom:10px;
}

.detail-box p{
    font-size:14px;

    line-height:1.8;

.detail-box ul{

}

.detail-box li{
    padding:11px;
    margin-top:8px;
    border-radius:10px;
    background:#f5f7fb;
    color:#4b5b70;
    font-size:14px;

/* ================= ORDER BUTTON ================= */

.order-btn{

    padding:13px;

    background:#ef2f61;
    color:#ffffff;

    font-size:15px;
    font-weight:700;
    cursor:pointer;

}

.order-btn:active{

/* ================= OFFER ================= */

.offer-grid{

    grid-template-columns:repeat(2,1fr);
    gap:9px;

.offer{

    font-size:13px;
    font-weight:700;
    cursor:pointer;

.offer:active{

/* ================= CUSTOM INPUT ================= */

.custom-input{

    border:1px solid #dce1ea;
    border-radius:11px;
    font-family:inherit;
    font-size:15px;

    margin-top:8px;

.custom-input:focus{

textarea.custom-input{

.admin-card{

.admin-send-grid{

.playpoints-card{

.play-description{
    color:#c8d1df;
    font-size:18px;
    line-height:1.8;
    margin-bottom:30px;

.country-heading{
    color:#ffffff;
    font-size:22px;
    font-weight:700;
    line-height:1.7;
    margin-bottom:20px;

.play-country-list{

    gap:12px;

.play-country{

    border-radius:14px;

.play-security-box{

    padding:20px;
    color:#e1d2a3;
    font-size:15px;
    line-height:1.75;

/* ================= TIKTOK ================= */

.coin-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.coin-btn{
    border:none;

    border-radius:13px;

    font-family:inherit;
    font-size:14px;
    font-weight:700;

/* ================= CONTACT ================= */

.contact-card{
    background:#ffffff;
    border-radius:18px;
    padding:20px;
    margin-bottom:15px;
    text-align:center;
    box-shadow:0 5px 18px rgba(0,0,0,.06);

.contact-icon{
    width:65px;
    height:65px;
    border-radius:50%;

    align-items:center;
    justify-content:center;
    background:#fff0f3;
    font-size:32px;
}

.contact-card h3{
    color:#30435c;
    font-size:19px;
}

.contact-card p{
    color:#718096;
    margin-top:5px;
}

@media(max-width:350px){

    .services{
        gap:18px 8px;
        padding:0 10px 20px;
    }

    .service-title{
        font-size:10px;
    }

}

</style>

/* ================= SELECT ADMIN ================= */

function selectAdmin(service,details){

    openPage("contact");

    setTimeout(function(){

        let message =
        "🛒 নতুন অর্ডার\n\n" +
        "📌 সার্ভিস: " + service + "\n" +
        "📝 বিস্তারিত: " + details + "\n\n" +
        "আমি এই সার্ভিসটি নিতে চাই। বিস্তারিত জানাবেন।";

        document.getElementById(
            "orderMessage"
        ).value = message;

        document.getElementById(
            "contactTitle"
        ).innerText = "🛒 অর্ডার সম্পন্ন করুন";

        window.scrollTo({
            top:document.body.scrollHeight,
            behavior:"smooth"
        });

    },300);

}

/* ================= SEND WHATSAPP ================= */

function sendWhatsAppTo(number){

    let message =
    document.getElementById(
        "orderMessage"
    ).value.trim();

    if(message === ""){

        alert(
            "দয়া করে অর্ডারের বিস্তারিত লিখুন।"
        );

        return;
    }

    let url =
    "https://wa.me/" +
    number +
    "?text=" +
    encodeURIComponent(message);

    window.open(url,"_blank");

}

/* ================= CUSTOM TIKTOK COIN ================= */

function customCoin(){

    let amount =
    document.getElementById(
        "customCoinAmount"
    ).value;

            "দয়া করে প্রয়োজনীয় Coin এর পরিমাণ লিখুন।"
        );

        return;
    }

    selectAdmin(
        "TikTok Coin",
        amount + " Coin প্রয়োজন"
    );

}

/* ================= OPEN PAGE ================= */

let currentPage = null;

function openPage(name){

    let page = pages[name];

    if(!page){
        return;
    }

    document.getElementById(
        "homePage"
    ).style.display = "none";

    document.getElementById(
        "detailPage"
    ).style.display = "block";

    document.getElementById(
        "detailIcon"
    ).innerText = page.icon;

    document.getElementById(
        "detailTitle"
    ).innerText = page.title;

    document.getElementById(
        "headerTitle"
    ).innerText = page.title;

    document.getElementById(
        "detailSubtitle"
    ).innerText = page.subtitle;

    document.getElementById(
        "detailContent"
    ).innerHTML = page.content;

    currentPage = name;

    window.scrollTo(0,0);

}

/* ================= HOME ================= */

function goHome(){

    document.getElementById(
        "detailPage"
    ).style.display = "none";

    document.getElementById(
        "homePage"
    ).style.display = "block";

    currentPage = null;

    window.scrollTo(0,0);

}

function goBack(){
    goHome();
}

/* ================= SERVICES ================= */

function scrollToServices(){

    if(currentPage !== null){
        goHome();
    }

    setTimeout(function(){

        document.getElementById(
            "mainServices"
        ).scrollIntoView({
            behavior:"smooth"
        });

    },100);

}

</script>
